<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Logo FabLab ETSIT UPM">
  <title>Logo FabLab ETSIT UPM</title>
  <defs>
    <filter id="logoGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Single "tomoe" (comma) petal, reused 3 times rotated 120° apart, like the classic Fab Lab mark -->
    <path id="logoPetal" d="M50,1 A49,49 0 0,1 50,99 A24.5,24.5 0 0,1 50,50 A24.5,24.5 0 0,1 50,1 Z"/>
  </defs>

  <!-- Three-piece pinwheel mark, recolored in ETSIT orange/blue + a synthwave cyan accent -->
  <g filter="url(#logoGlow)">
    <use href="#logoPetal" fill="#f7931e" stroke="#0d0221" stroke-width="1.5" transform="rotate(0 50 50)"/>
    <use href="#logoPetal" fill="#14337a" stroke="#0d0221" stroke-width="1.5" transform="rotate(120 50 50)"/>
    <use href="#logoPetal" fill="#05d9e8" stroke="#0d0221" stroke-width="1.5" transform="rotate(240 50 50)"/>
  </g>
</svg>
