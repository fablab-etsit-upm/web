<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Logo FabLab ETSIT UPM">
  <title>Logo FabLab ETSIT UPM</title>
  <defs>
    <filter id="logoGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Three-piece cascading mark, in the spirit of the classic Fab Lab logo, in ETSIT orange/blue + a synthwave cyan accent -->
  <g filter="url(#logoGlow)">
    <rect x="30" y="30" width="80" height="80" rx="16" fill="#0057b8" stroke="#0d0221" stroke-width="3"
          transform="rotate(45 70 70)"/>
    <rect x="65" y="65" width="80" height="80" rx="16" fill="#ff7a1a" stroke="#0d0221" stroke-width="3"
          transform="rotate(45 105 105)"/>
    <rect x="100" y="100" width="58" height="58" rx="14" fill="#05d9e8" stroke="#0d0221" stroke-width="3"
          transform="rotate(45 129 129)"/>
  </g>
</svg>
