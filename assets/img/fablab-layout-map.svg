<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img" aria-labelledby="mapTitle mapDesc">
  <title id="mapTitle">Plano conceptual del futuro FabLab ETSIT UPM</title>
  <desc id="mapDesc">Mapa teórico estilo videojuego retro con las zonas previstas del laboratorio: aula polivalente, impresión 3D, CNC y corte láser, banco de soldadura, El Reparador, almacén, zona de clubes con mesa colaborativa, escaleras y entrada.</desc>

  <defs>
    <pattern id="pixelGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#05d9e8" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <pattern id="stairTread" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="7" fill="#a855f7" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="960" height="700" fill="#170b3b"/>
  <rect width="960" height="700" fill="url(#pixelGrid)"/>

  <!-- Outer frame (arcade cabinet border) -->
  <rect x="10" y="10" width="940" height="610" fill="none" stroke="#ff2d95" stroke-width="6"/>
  <rect x="18" y="18" width="924" height="594" fill="none" stroke="#05d9e8" stroke-width="2" stroke-dasharray="10 6"/>

  <!-- Scattered pixel sparkles -->
  <g fill="#f9f871">
    <rect x="300" y="60" width="8" height="8" transform="rotate(45 304 64)"/>
    <rect x="650" y="360" width="8" height="8" transform="rotate(45 654 364)"/>
    <rect x="60" y="365" width="8" height="8" transform="rotate(45 64 369)"/>
    <rect x="900" y="200" width="8" height="8" transform="rotate(45 904 204)"/>
  </g>

  <!-- ROW 1: Aula Polivalente -->
  <g>
    <rect x="40" y="40" width="880" height="110" fill="#f9f871" fill-opacity="0.08" stroke="#f9f871" stroke-width="5"/>
    <text x="480" y="85" text-anchor="middle" font-size="34" font-family="monospace">🎓</text>
    <text x="480" y="120" text-anchor="middle" font-size="20" font-weight="bold" font-family="monospace" fill="#f9f871">AULA POLIVALENTE</text>
    <text x="480" y="140" text-anchor="middle" font-size="12" font-family="monospace" fill="#f5f3ff">TALLERES · FORMACIÓN · CHARLAS</text>
  </g>

  <!-- ROW 2: four workshop rooms -->
  <g>
    <rect x="40" y="175" width="200" height="170" fill="#05d9e8" fill-opacity="0.08" stroke="#05d9e8" stroke-width="5"/>
    <text x="140" y="225" text-anchor="middle" font-size="30" font-family="monospace">🖨️</text>
    <text x="140" y="260" text-anchor="middle" font-size="15" font-weight="bold" font-family="monospace" fill="#05d9e8">IMPRESIÓN 3D</text>
    <text x="140" y="280" text-anchor="middle" font-size="11" font-family="monospace" fill="#f5f3ff">FDM · SLA · METAL</text>
  </g>

  <g>
    <rect x="260" y="175" width="200" height="170" fill="#ff2d95" fill-opacity="0.08" stroke="#ff2d95" stroke-width="5"/>
    <text x="360" y="225" text-anchor="middle" font-size="30" font-family="monospace">⚙️</text>
    <text x="360" y="260" text-anchor="middle" font-size="15" font-weight="bold" font-family="monospace" fill="#ff2d95">CNC Y LÁSER</text>
    <text x="360" y="280" text-anchor="middle" font-size="11" font-family="monospace" fill="#f5f3ff">FRESADO · CORTE · GRABADO</text>
  </g>

  <g>
    <rect x="480" y="175" width="200" height="170" fill="#a855f7" fill-opacity="0.08" stroke="#a855f7" stroke-width="5"/>
    <text x="580" y="225" text-anchor="middle" font-size="30" font-family="monospace">🔧</text>
    <text x="580" y="260" text-anchor="middle" font-size="15" font-weight="bold" font-family="monospace" fill="#a855f7">SOLDADURA</text>
    <text x="580" y="280" text-anchor="middle" font-size="11" font-family="monospace" fill="#f5f3ff">ELECTRÓNICA · PCB</text>
  </g>

  <g>
    <rect x="700" y="175" width="220" height="170" fill="#f9f871" fill-opacity="0.08" stroke="#f9f871" stroke-width="5"/>
    <text x="810" y="225" text-anchor="middle" font-size="30" font-family="monospace">🛠️</text>
    <text x="810" y="260" text-anchor="middle" font-size="15" font-weight="bold" font-family="monospace" fill="#f9f871">EL REPARADOR</text>
    <text x="810" y="280" text-anchor="middle" font-size="11" font-family="monospace" fill="#f5f3ff">DIAGNÓSTICO · RECICLAJE</text>
  </g>

  <!-- ROW 3: storage, collaborative club hub, stairs + entrance -->
  <g>
    <rect x="40" y="370" width="260" height="210" fill="#05d9e8" fill-opacity="0.08" stroke="#05d9e8" stroke-width="5"/>
    <text x="170" y="450" text-anchor="middle" font-size="30" font-family="monospace">📦</text>
    <text x="170" y="485" text-anchor="middle" font-size="15" font-weight="bold" font-family="monospace" fill="#05d9e8">ALMACÉN</text>
    <text x="170" y="505" text-anchor="middle" font-size="11" font-family="monospace" fill="#f5f3ff">MATERIAL · CONSUMIBLES</text>
  </g>

  <!-- Collaborative round table, inspired by the classic Fab Lab "design center" hub -->
  <g>
    <rect x="320" y="370" width="320" height="210" fill="none" stroke="#ff2d95" stroke-width="3" stroke-dasharray="6 8"/>
    <text x="480" y="400" text-anchor="middle" font-size="15" font-weight="bold" font-family="monospace" fill="#ff2d95">ZONA CLUBES</text>
    <text x="480" y="418" text-anchor="middle" font-size="11" font-family="monospace" fill="#f5f3ff">IEEE · CROM · EURIELE · TEATRO...</text>

    <circle cx="480" cy="490" r="70" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-width="4"/>
    <text x="480" y="497" text-anchor="middle" font-size="26" font-family="monospace">🎉</text>

    <!-- stools around the collaborative table -->
    <g fill="#170b3b" stroke="#05d9e8" stroke-width="3">
      <circle cx="480" cy="405" r="11"/>
      <circle cx="553" cy="450" r="11"/>
      <circle cx="553" cy="530" r="11"/>
      <circle cx="480" cy="575" r="11"/>
      <circle cx="407" cy="530" r="11"/>
      <circle cx="407" cy="450" r="11"/>
    </g>
  </g>

  <g>
    <rect x="700" y="370" width="220" height="95" fill="url(#stairTread)" stroke="#a855f7" stroke-width="5"/>
    <text x="810" y="410" text-anchor="middle" font-size="22" font-family="monospace">🪜</text>
    <text x="810" y="440" text-anchor="middle" font-size="13" font-weight="bold" font-family="monospace" fill="#a855f7">ESCALERAS</text>
  </g>

  <g>
    <rect x="700" y="485" width="220" height="95" fill="#f9f871" fill-opacity="0.08" stroke="#f9f871" stroke-width="5"/>
    <text x="810" y="525" text-anchor="middle" font-size="22" font-family="monospace">🚪</text>
    <text x="810" y="555" text-anchor="middle" font-size="13" font-weight="bold" font-family="monospace" fill="#f9f871">ENTRADA</text>
  </g>

  <!-- Compass, key-plan style -->
  <g transform="translate(28,598)" stroke="#05d9e8" fill="#05d9e8">
    <circle r="18" fill="none" stroke-width="2"/>
    <line x1="0" y1="-18" x2="0" y2="18" stroke-width="1.5"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke-width="1.5"/>
    <text y="-22" text-anchor="middle" font-size="10" font-family="monospace" stroke="none">N</text>
  </g>

  <!-- Title block, arcade-sketch style -->
  <g font-family="monospace">
    <rect x="10" y="632" width="940" height="55" fill="none" stroke="#f9f871" stroke-width="3"/>
    <text x="26" y="655" font-size="13" fill="#f9f871" font-weight="bold">PLANO CONCEPTUAL — NO ES EL LAYOUT FINAL</text>
    <text x="26" y="674" font-size="11" fill="#f5f3ff">Inspirado en el layout de referencia "Chicago" de la Fab Foundation</text>
    <text x="934" y="655" text-anchor="end" font-size="13" fill="#05d9e8" font-weight="bold">FABLAB ETSIT UPM</text>
    <text x="934" y="674" text-anchor="end" font-size="11" fill="#f5f3ff">EDIFICIO A · SÓTANO · 2026 → 2027</text>
  </g>
</svg>
